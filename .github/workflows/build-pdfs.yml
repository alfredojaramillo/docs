name: Build PDFs

# Compile the LaTeX note projects and (1) publish the resulting PDFs as
# downloadable build artifacts and (2) on main, deploy them to GitHub Pages
# (via the GitHub Actions deployment, no gh-pages branch) so they are served
# at a public URL. The PDFs are not tracked in git; this workflow is how a
# rendered copy is obtained without a local TeX install.

on:
  push:
    branches: [main]
    paths:
      - 'ProbabilityAndStatistics/**'
      - 'MeasureTheory/**'
      - '.github/workflows/build-pdfs.yml'
  pull_request:
    paths:
      - 'ProbabilityAndStatistics/**'
      - 'MeasureTheory/**'
      - '.github/workflows/build-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent Pages deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Single job in the full TeX Live container: the image is pulled once and
    # both documents compile in it, instead of a matrix that pulls it per doc.
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - name: Install git and make
        # git: required by actions/checkout inside the container.
        # make: used to build each document via its Makefile.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git make

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile documents
        run: |
          set -e
          for d in ProbabilityAndStatistics MeasureTheory; do
            echo "::group::make -C $d"
            make -C "$d"
            echo "::endgroup::"
          done

      - name: Upload ProbabilityAndStatistics PDF
        uses: actions/upload-artifact@v4
        with:
          name: ProbabilityAndStatistics
          path: ProbabilityAndStatistics/*.pdf
          if-no-files-found: error

      - name: Upload MeasureTheory PDF
        uses: actions/upload-artifact@v4
        with:
          name: MeasureTheory
          path: MeasureTheory/*.pdf
          if-no-files-found: error

  deploy:
    # Deploy the compiled PDFs to GitHub Pages. main only, never on PRs.
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download compiled PDFs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          # download-artifact places each artifact under artifacts/<name>/
          find artifacts -name '*.pdf' -exec cp {} site/ \;
          {
            echo '<!doctype html>'
            echo '<html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Notes</title>'
            echo '<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;line-height:1.5}h1{font-size:1.4rem}li{margin:.4rem 0}</style>'
            echo '</head><body>'
            echo '<h1>Compiled notes</h1><ul>'
            for f in $(cd site && ls *.pdf | sort); do
              echo "<li><a href=\"$f\">$f</a></li>"
            done
            echo '</ul></body></html>'
          } > site/index.html
          echo "--- site contents ---"
          ls -l site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
